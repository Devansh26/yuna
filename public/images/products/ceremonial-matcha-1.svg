<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="60%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#EAF0DE"/>
      <stop offset="60%" stop-color="#DDE6CF"/>
      <stop offset="100%" stop-color="#C8D4B8"/>
    </radialGradient>
    <radialGradient id="bowl" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#EDE8DC"/>
    </radialGradient>
    <radialGradient id="powder" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7D8A5A"/>
      <stop offset="100%" stop-color="#4A5530"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bg)"/>

  <!-- Subtle linen texture lines -->
  <g opacity="0.06">
    <line x1="0" y1="50" x2="800" y2="50" stroke="#343D2D" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="800" y2="150" stroke="#343D2D" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="800" y2="250" stroke="#343D2D" stroke-width="0.5"/>
    <line x1="0" y1="350" x2="800" y2="350" stroke="#343D2D" stroke-width="0.5"/>
    <line x1="0" y1="450" x2="800" y2="450" stroke="#343D2D" stroke-width="0.5"/>
    <line x1="0" y1="550" x2="800" y2="550" stroke="#343D2D" stroke-width="0.5"/>
    <line x1="0" y1="650" x2="800" y2="650" stroke="#343D2D" stroke-width="0.5"/>
    <line x1="0" y1="750" x2="800" y2="750" stroke="#343D2D" stroke-width="0.5"/>
    <line x1="0" y1="850" x2="800" y2="850" stroke="#343D2D" stroke-width="0.5"/>
    <line x1="0" y1="950" x2="800" y2="950" stroke="#343D2D" stroke-width="0.5"/>
  </g>

  <!-- Soft shadow under bowl -->
  <ellipse cx="400" cy="680" rx="220" ry="30" fill="#343D2D" opacity="0.12"/>

  <!-- Bowl -->
  <ellipse cx="400" cy="440" rx="260" ry="80" fill="#FCFAF6" opacity="0.9"/>
  <path d="M140 440 Q160 650 400 660 Q640 650 660 440 Z" fill="url(#bowl)"/>
  <ellipse cx="400" cy="440" rx="260" ry="80" fill="#F6F3EC"/>

  <!-- Matcha inside bowl -->
  <ellipse cx="400" cy="425" rx="220" ry="60" fill="#6B7A48" opacity="0.85"/>
  <ellipse cx="400" cy="420" rx="200" ry="52" fill="#7D8A5A"/>
  <!-- Foam pattern -->
  <circle cx="380" cy="415" r="18" fill="#9EA87A" opacity="0.5"/>
  <circle cx="420" cy="418" r="14" fill="#8A9466" opacity="0.4"/>
  <circle cx="395" cy="410" r="10" fill="#FCFAF6" opacity="0.25"/>
  <circle cx="412" cy="422" r="8" fill="#FCFAF6" opacity="0.2"/>

  <!-- Rim highlight -->
  <ellipse cx="400" cy="440" rx="260" ry="80" fill="none" stroke="#FCFAF6" stroke-width="3" opacity="0.6"/>

  <!-- Sprig / garnish -->
  <path d="M300 280 Q320 240 340 260 Q310 290 300 280Z" fill="#626A43" opacity="0.7"/>
  <path d="M320 270 Q345 225 365 250 Q330 282 320 270Z" fill="#4A5530" opacity="0.6"/>
  <line x1="300" y1="280" x2="360" y2="290" stroke="#343D2D" stroke-width="1.5" opacity="0.4"/>

  <!-- Tin in background -->
  <rect x="540" y="260" width="120" height="160" rx="4" fill="#343D2D" opacity="0.85"/>
  <rect x="540" y="260" width="120" height="40" rx="4" fill="#4A5530" opacity="0.9"/>
  <text x="600" y="362" font-family="Georgia, serif" font-size="9" fill="#FCFAF6" text-anchor="middle" letter-spacing="2" opacity="0.9">CEREMONIAL</text>
  <text x="600" y="380" font-family="Georgia, serif" font-size="11" fill="#FCFAF6" text-anchor="middle" letter-spacing="3" opacity="0.9">MATCHA</text>

  <!-- Wooden surface -->
  <rect x="0" y="680" width="800" height="320" fill="#DDD5C4" opacity="0.4"/>
  <line x1="0" y1="720" x2="800" y2="728" stroke="#C8BFB0" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="780" x2="800" y2="775" stroke="#C8BFB0" stroke-width="0.8" opacity="0.4"/>

  <!-- YUNA wordmark -->
  <text x="400" y="870" font-family="'Inter', sans-serif" font-size="13" fill="#292925" text-anchor="middle" letter-spacing="8" opacity="0.5">YUNA</text>
  <text x="400" y="895" font-family="'Inter', sans-serif" font-size="8" fill="#626A43" text-anchor="middle" letter-spacing="4" opacity="0.6">CEREMONIAL MATCHA · UJI, KYOTO</text>
</svg>
