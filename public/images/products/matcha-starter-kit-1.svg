  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <!-- Kraft box background -->
  <rect x="100" y="280" width="600" height="460" rx="6" fill="#C8A878" opacity="0.85"/>
  <rect x="100" y="280" width="600" height="460" rx="6" fill="none" stroke="#A88050" stroke-width="2"/>
  <!-- Box interior / liner -->
  <rect x="116" y="296" width="568" height="428" rx="4" fill="#E8D8B8" opacity="0.9"/>
