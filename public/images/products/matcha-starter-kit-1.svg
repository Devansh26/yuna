  <text x="400" y="235" font-family="'Inter', sans-serif" font-size="9" fill="#F6F3EC" text-anchor="middle" letter-spacing="8">YUNA</text>
  <text x="400" y="870" font-family="'Inter', sans-serif" font-size="11" fill="#292925" text-anchor="middle" letter-spacing="6" opacity="0.4">YUNA</text>
  <text x="400" y="892" font-family="'Inter', sans-serif" font-size="8" fill="#626A43" text-anchor="middle" letter-spacing="3" opacity="0.5">MATCHA STARTER KIT</text>
