<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#EEF5CC"/>
      <stop offset="60%" stop-color="#D8ECA0"/>
      <stop offset="100%" stop-color="#C0D880"/>
    </radialGradient>
    <linearGradient id="drink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8EA56A" stop-opacity="0.88"/>
      <stop offset="35%" stop-color="#BED870" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#FCFAF6" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect x="0" y="720" width="800" height="280" fill="#D0E490" opacity="0.35"/>
  <!-- Glass shadow -->
  <ellipse cx="400" cy="726" rx="110" ry="15" fill="#4A6020" opacity="0.12"/>
  <!-- Glass -->
  <path d="M308 160 L338 720 L462 720 L492 160 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.55"/>
  <path d="M311 163 L340 716 L460 716 L489 163 Z" fill="url(#drink)" opacity="0.87"/>
  <!-- Ice -->
  <rect x="352" y="520" width="48" height="44" rx="5" fill="#FFFFFF" opacity="0.5"/>
  <rect x="386" y="500" width="42" height="38" rx="5" fill="#FFFFFF" opacity="0.42"/>
  <!-- Yuzu citrus slice (distinctive garnish) -->
  <circle cx="336" cy="172" r="40" fill="#F0C830"/>
  <circle cx="336" cy="172" r="34" fill="#F4D844"/>
  <!-- Citrus segments -->
  <line x1="336" y1="138" x2="336" y2="206" stroke="#D4A820" stroke-width="1.5" opacity="0.5"/>
  <line x1="302" y1="172" x2="370" y2="172" stroke="#D4A820" stroke-width="1.5" opacity="0.5"/>
  <line x1="312" y1="148" x2="360" y2="196" stroke="#D4A820" stroke-width="1" opacity="0.4"/>
  <line x1="360" y1="148" x2="312" y2="196" stroke="#D4A820" stroke-width="1" opacity="0.4"/>
  <circle cx="336" cy="172" r="10" fill="#F0C830"/>
  <!-- Straw -->
  <rect x="432" y="80" width="13" height="660" rx="6.5" fill="#8EA56A"/>
  <rect x="433" y="80" width="5" height="660" rx="2.5" fill="#FCFAF6" opacity="0.3"/>
  <!-- Foam top -->
  <ellipse cx="400" cy="165" rx="74" ry="18" fill="#FCFAF6" opacity="0.75"/>
  <!-- Glass shine -->
  <path d="M315 175 L332 710" stroke="#FFFFFF" stroke-width="6" opacity="0.18"/>
  <text x="400" y="870" font-family="'Inter', sans-serif" font-size="11" fill="#292925" text-anchor="middle" letter-spacing="6" opacity="0.4">YUNA</text>
  <text x="400" y="892" font-family="'Inter', sans-serif" font-size="8" fill="#626A43" text-anchor="middle" letter-spacing="3" opacity="0.6">YUZU MATCHA · CITRUS BLEND</text>
</svg>
