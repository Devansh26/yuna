<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#E8E0D4"/>
      <stop offset="60%" stop-color="#D4C4A8"/>
      <stop offset="100%" stop-color="#B8A080"/>
    </radialGradient>
    <linearGradient id="tin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1C1208"/>
      <stop offset="50%" stop-color="#2E1C0C"/>
      <stop offset="100%" stop-color="#1C1208"/>
    </linearGradient>
    <linearGradient id="layers" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5A7A38" stop-opacity="0.88"/>
      <stop offset="45%" stop-color="#3A1C08" stop-opacity="0.82"/>
      <stop offset="100%" stop-color="#FCFAF6" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect x="0" y="680" width="800" height="320" fill="#C0A880" opacity="0.38"/>
  <!-- Cup shadow -->
  <ellipse cx="400" cy="684" rx="115" ry="16" fill="#1C1208" opacity="0.12"/>
  <!-- Layered glass drink -->
  <path d="M306 200 L336 680 L464 680 L494 200 Z" fill="none" stroke="#FFFFFF" stroke-width="2.5" opacity="0.5"/>
  <path d="M309 203 L338 676 L462 676 L491 203 Z" fill="url(#layers)" opacity="0.88"/>
  <!-- Matcha green top layer -->
  <path d="M314 215 L486 215 L483 300 L317 300 Z" fill="#5A7A38" opacity="0.88"/>
  <!-- Chocolate middle layer -->
  <path d="M317 300 L483 300 L479 480 L321 480 Z" fill="#3A1C08" opacity="0.84"/>
  <!-- Cream bottom -->
  <path d="M321 480 L479 480 L464 676 L336 676 Z" fill="#F8F0E8" opacity="0.9"/>
  <!-- Ice cubes -->
  <rect x="352" y="510" width="46" height="42" rx="5" fill="#FFFFFF" opacity="0.5"/>
  <rect x="384" y="490" width="40" height="36" rx="5" fill="#FFFFFF" opacity="0.42"/>
  <!-- Foam latte art top -->
  <ellipse cx="400" cy="210" rx="76" ry="18" fill="#FFFFFF" opacity="0.8"/>
  <ellipse cx="400" cy="206" rx="32" ry="12" fill="#5A7A38" opacity="0.45"/>
  <!-- Cacao powder dusting -->
  <ellipse cx="390" cy="204" rx="20" ry="8" fill="#3A1C08" opacity="0.3"/>
  <!-- Straw -->
  <rect x="430" y="100" width="13" height="600" rx="6.5" fill="#4A3020"/>
  <rect x="431" y="100" width="5" height="600" rx="2.5" fill="#FCFAF6" opacity="0.25"/>
  <!-- Glass shine -->
  <path d="M313 215 L330 670" stroke="#FFFFFF" stroke-width="6" opacity="0.18"/>
  <!-- Cacao nibs garnish -->
  <ellipse cx="360" cy="196" rx="6" ry="4" fill="#2A1408" transform="rotate(-15,360,196)"/>
  <ellipse cx="348" cy="200" rx="5" ry="3" fill="#3A1C08" transform="rotate(10,348,200)"/>
  <ellipse cx="375" cy="194" rx="5" ry="3" fill="#2A1408" transform="rotate(-5,375,194)"/>
  <text x="400" y="870" font-family="'Inter', sans-serif" font-size="11" fill="#292925" text-anchor="middle" letter-spacing="6" opacity="0.4">YUNA</text>
  <text x="400" y="892" font-family="'Inter', sans-serif" font-size="8" fill="#4A3020" text-anchor="middle" letter-spacing="3" opacity="0.6">CHOCOLATE MATCHA · CACAO BLEND</text>
</svg>
