  <path d="M520 520 Q535 560 530 600" fill="none" stroke="#DDD8CC" stroke-width="3" opacity="0.4"/>
  <text x="400" y="870" font-family="'Inter', sans-serif" font-size="11" fill="#292925" text-anchor="middle" letter-spacing="6" opacity="0.4">YUNA</text>
  <text x="400" y="892" font-family="'Inter', sans-serif" font-size="8" fill="#AA9068" text-anchor="middle" letter-spacing="3" opacity="0.5">MATCHA BOWL · CERAMIC CHAWAN</text>
</svg>
