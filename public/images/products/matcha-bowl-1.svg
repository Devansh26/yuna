<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#EEF2E8"/>
      <stop offset="100%" stop-color="#D4DCC4"/>
    </radialGradient>
    <radialGradient id="bowl" cx="45%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#F8F6F0"/>
      <stop offset="100%" stop-color="#E0DED0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect x="0" y="700" width="800" height="300" fill="#D4D0C0" opacity="0.45"/>
  <!-- Shadow -->
  <ellipse cx="400" cy="706" rx="210" ry="24" fill="#343D2D" opacity="0.11"/>
  <!-- Bowl outer -->
  <ellipse cx="400" cy="460" rx="270" ry="82" fill="#E8E4DC"/>
  <path d="M130 460 Q148 670 400 682 Q652 670 670 460 Z" fill="url(#bowl)"/>
  <ellipse cx="400" cy="460" rx="270" ry="82" fill="#F0EDE6"/>
  <!-- Inside top view -->
  <ellipse cx="400" cy="445" rx="228" ry="65" fill="#E8E4DC"/>
