  <ellipse cx="400" cy="443" rx="60" ry="18" fill="#8A9466" opacity="0.12"/>
  <!-- Foot ring shadow -->
  <ellipse cx="400" cy="682" rx="80" ry="14" fill="#B0A898" opacity="0.3"/>
