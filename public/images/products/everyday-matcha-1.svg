<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#E8F0DC"/>
      <stop offset="100%" stop-color="#C5D4A8"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <!-- surface -->
  <rect x="0" y="680" width="800" height="320" fill="#E4DDD0" opacity="0.5"/>
