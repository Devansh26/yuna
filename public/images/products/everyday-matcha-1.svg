  <rect x="240" y="180" width="320" height="420" rx="12" fill="#343D2D"/>
  <rect x="240" y="180" width="320" height="70" rx="12" fill="#4A5530"/>
  <!-- label -->
  <rect x="264" y="298" width="272" height="180" rx="4" fill="#F6F3EC" opacity="0.95"/>
  <text x="400" y="362" font-family="Georgia, serif" font-size="11" fill="#343D2D" text-anchor="middle" letter-spacing="4">YUNA</text>
  <text x="400" y="390" font-family="Georgia, serif" font-size="16" fill="#343D2D" text-anchor="middle" letter-spacing="2">Everyday</text>
  <text x="400" y="412" font-family="Georgia, serif" font-size="16" fill="#343D2D" text-anchor="middle" letter-spacing="2">Matcha</text>
  <text x="400" y="444" font-family="'Inter', sans-serif" font-size="8" fill="#626A43" text-anchor="middle" letter-spacing="2">KAGOSHIMA · JAPAN</text>
  <!-- scoop -->
  <ellipse cx="580" cy="580" rx="35" ry="20" fill="#8EA56A" opacity="0.9"/>
  <rect x="570" y="560" width="80" height="8" rx="4" fill="#6B8050" transform="rotate(25,580,570)"/>
