<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="55%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#E0EDD4"/>
      <stop offset="60%" stop-color="#C8DFB4"/>
      <stop offset="100%" stop-color="#A8C890"/>
    </radialGradient>
    <linearGradient id="tin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1A2814"/>
      <stop offset="50%" stop-color="#2C3E20"/>
      <stop offset="100%" stop-color="#1A2814"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect x="0" y="660" width="800" height="340" fill="#C0D4A0" opacity="0.4"/>
  <ellipse cx="400" cy="666" rx="200" ry="24" fill="#1A2814" opacity="0.12"/>
  <!-- Premium tin — taller and slimmer for premium feel -->
  <rect x="268" y="180" width="264" height="460" rx="10" fill="url(#tin)"/>
  <!-- Lid -->
  <rect x="260" y="170" width="280" height="58" rx="8" fill="#3A5428"/>
  <rect x="268" y="218" width="264" height="10" fill="#1A2814" opacity="0.45"/>
  <!-- Organic leaf embossed on tin -->
  <path d="M380 310 Q400 280 420 310 Q400 340 380 310Z" fill="#3A5428" opacity="0.6"/>
  <path d="M390 305 Q400 268 410 305 Q400 335 390 305Z" fill="#4A6830" opacity="0.5"/>
  <line x1="400" y1="340" x2="400" y2="370" stroke="#3A5428" stroke-width="1.5" opacity="0.4"/>
  <!-- Premium label (cream on dark) -->
  <rect x="294" y="360" width="212" height="220" rx="4" fill="#F6F3EC" opacity="0.95"/>
  <!-- Top badge: ORGANIC -->
  <rect x="320" y="374" width="160" height="20" rx="2" fill="#3A5428"/>
  <text x="400" y="388" font-family="'Inter', sans-serif" font-size="7.5" fill="#F6F3EC" text-anchor="middle" letter-spacing="3">ORGANIC · SINGLE CULTIVAR</text>
  <!-- Product name -->
  <text x="400" y="418" font-family="Georgia, serif" font-size="10" fill="#1A2814" text-anchor="middle" letter-spacing="5">YUNA</text>
  <line x1="308" y1="428" x2="492" y2="428" stroke="#8AAA60" stroke-width="0.75"/>
  <text x="400" y="450" font-family="Georgia, serif" font-size="15" fill="#1A2814" text-anchor="middle" letter-spacing="0.5">Okumidori</text>
  <text x="400" y="470" font-family="Georgia, serif" font-size="13" fill="#1A2814" text-anchor="middle" letter-spacing="0.5">First Harvest</text>
  <text x="400" y="490" font-family="Georgia, serif" font-size="13" fill="#1A2814" text-anchor="middle" letter-spacing="0.5">Matcha</text>
  <line x1="308" y1="502" x2="492" y2="502" stroke="#8AAA60" stroke-width="0.75"/>
  <text x="400" y="520" font-family="'Inter', sans-serif" font-size="7.5" fill="#3A5428" text-anchor="middle" letter-spacing="2">KAGOSHIMA · JAPAN · 30G</text>
  <text x="400" y="538" font-family="'Inter', sans-serif" font-size="7" fill="#1A2814" text-anchor="middle" letter-spacing="1" opacity="0.6">SHADE-GROWN · STONE-GROUND</text>
  <!-- Bottom of tin -->
  <text x="400" y="620" font-family="'Inter', sans-serif" font-size="8" fill="#6AAA50" text-anchor="middle" letter-spacing="2" opacity="0.6">CEREMONIAL GRADE ✦</text>
  <text x="400" y="870" font-family="'Inter', sans-serif" font-size="11" fill="#292925" text-anchor="middle" letter-spacing="6" opacity="0.4">YUNA</text>
  <text x="400" y="892" font-family="'Inter', sans-serif" font-size="8" fill="#3A5428" text-anchor="middle" letter-spacing="3" opacity="0.6">OKUMIDORI · SINGLE CULTIVAR</text>
</svg>
