<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="55%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F5E8D4"/>
      <stop offset="60%" stop-color="#E8D5BB"/>
      <stop offset="100%" stop-color="#D4BC9A"/>
    </radialGradient>
    <radialGradient id="bowl" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FCFAF6"/>
      <stop offset="100%" stop-color="#EDE5D8"/>
    </radialGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <!-- Wooden surface -->
  <rect x="0" y="680" width="800" height="320" fill="#C4A882" opacity="0.35"/>
  <line x1="0" y1="720" x2="800" y2="715" stroke="#B89870" stroke-width="1" opacity="0.4"/>
  <!-- Shadow -->
  <ellipse cx="400" cy="678" rx="230" ry="26" fill="#5A3820" opacity="0.1"/>
  <!-- Bowl -->
  <ellipse cx="400" cy="440" rx="260" ry="78" fill="#FCFAF6" opacity="0.9"/>
  <path d="M140 440 Q158 648 400 658 Q642 648 660 440 Z" fill="url(#bowl)"/>
  <ellipse cx="400" cy="440" rx="260" ry="78" fill="#F6F0E8"/>
  <!-- Hojicha inside bowl - warm brown -->
  <ellipse cx="400" cy="425" rx="220" ry="58" fill="#7A4F2E" opacity="0.85"/>
  <ellipse cx="400" cy="420" rx="200" ry="50" fill="#8C5C34"/>
  <!-- Warm foam -->
  <circle cx="385" cy="415" r="16" fill="#A8764E" opacity="0.5"/>
  <circle cx="418" cy="418" r="12" fill="#966040" opacity="0.4"/>
  <circle cx="398" cy="408" r="9" fill="#FCFAF6" opacity="0.22"/>
  <!-- Rim -->
  <ellipse cx="400" cy="440" rx="260" ry="78" fill="none" stroke="#FCFAF6" stroke-width="2.5" opacity="0.5"/>
  <!-- Steam wisps -->
  <path d="M350 300 Q340 260 355 240 Q370 220 360 200" fill="none" stroke="#C4A882" stroke-width="2" opacity="0.4"/>
  <path d="M400 290 Q390 250 405 230 Q420 210 410 188" fill="none" stroke="#C4A882" stroke-width="2" opacity="0.35"/>
  <path d="M450 300 Q440 262 455 242 Q470 222 462 200" fill="none" stroke="#C4A882" stroke-width="2" opacity="0.3"/>
  <!-- Cinnamon stick garnish -->
  <rect x="310" y="330" width="160" height="12" rx="6" fill="#8C5C34" transform="rotate(-20, 390, 336)"/>
  <rect x="312" y="332" width="156" height="4" rx="2" fill="#A8764E" opacity="0.5" transform="rotate(-20, 390, 336)"/>
  <text x="400" y="870" font-family="'Inter', sans-serif" font-size="11" fill="#292925" text-anchor="middle" letter-spacing="6" opacity="0.4">YUNA</text>
  <text x="400" y="892" font-family="'Inter', sans-serif" font-size="8" fill="#76563E" text-anchor="middle" letter-spacing="3" opacity="0.5">HOJICHA POWDER · KYOTO</text>
</svg>
