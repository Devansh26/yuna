<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FAE8EC"/>
      <stop offset="60%" stop-color="#F4D0D8"/>
      <stop offset="100%" stop-color="#E8B8C4"/>
    </radialGradient>
    <linearGradient id="glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7D8A5A" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#E8B8C4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#F4D0D8" stop-opacity="0.8"/>
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <!-- Surface -->
  <rect x="0" y="720" width="800" height="280" fill="#F0E4E8" opacity="0.45"/>
  <!-- Glass shadow -->
  <ellipse cx="400" cy="724" rx="110" ry="16" fill="#C87890" opacity="0.15"/>
  <!-- Glass body -->
  <path d="M310 180 L340 720 L460 720 L490 180 Z" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.6"/>
  <path d="M312 182 L341 718 L459 718 L488 182 Z" fill="url(#glass)" opacity="0.85"/>
  <!-- Ice cubes -->
  <rect x="355" y="590" width="50" height="48" rx="5" fill="#FFFFFF" opacity="0.55"/>
  <rect x="390" y="570" width="45" height="44" rx="5" fill="#FFFFFF" opacity="0.45"/>
  <rect x="368" y="640" width="42" height="40" rx="5" fill="#FFFFFF" opacity="0.5"/>
  <!-- Matcha layer at top -->
  <path d="M320 220 L480 220 L474 310 L326 310 Z" fill="#7D8A5A" opacity="0.8"/>
  <!-- Pink middle layer -->
  <path d="M326 310 L474 310 L468 500 L332 500 Z" fill="#D98C98" opacity="0.75"/>
  <!-- Milk bottom -->
  <path d="M332 500 L468 500 L459 718 L341 718 Z" fill="#FCFAF6" opacity="0.8"/>
  <!-- Glass shine -->
  <path d="M315 190 L330 710" stroke="#FFFFFF" stroke-width="6" opacity="0.2"/>
  <!-- Straw -->
  <rect x="415" y="100" width="14" height="640" rx="7" fill="#F6B4BC"/>
  <rect x="416" y="100" width="6" height="640" rx="3" fill="#FCFAF6" opacity="0.4"/>
  <!-- Strawberry garnish -->
  <ellipse cx="370" cy="175" rx="22" ry="18" fill="#E0404A"/>
  <path d="M348 166 Q370 150 392 166" fill="#C83040"/>
  <path d="M365 155 Q368 138 375 152" fill="#5A9040"/>
  <path d="M358 153 Q355 136 364 150" fill="#5A9040"/>
  <path d="M372 153 Q374 136 380 150" fill="#5A9040"/>
  <!-- Seed dots -->
  <ellipse cx="360" cy="172" rx="2" ry="1.5" fill="#FCFAF6" opacity="0.7"/>
  <ellipse cx="370" cy="168" rx="2" ry="1.5" fill="#FCFAF6" opacity="0.7"/>
  <ellipse cx="380" cy="174" rx="2" ry="1.5" fill="#FCFAF6" opacity="0.7"/>
  <text x="400" y="870" font-family="'Inter', sans-serif" font-size="11" fill="#292925" text-anchor="middle" letter-spacing="6" opacity="0.4">YUNA</text>
  <text x="400" y="892" font-family="'Inter', sans-serif" font-size="8" fill="#D98C98" text-anchor="middle" letter-spacing="3" opacity="0.6">STRAWBERRY MATCHA</text>
</svg>
